<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Base Stand -->
  <path d="M196 280 L316 280 L370 395 C372 400 368 406 362 406 L150 406 C144 406 140 400 142 395 Z" fill="#e2e8f0" filter="url(#shadow)" />
  <path d="M185 390 H327" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
  
  <!-- Receipt Paper coming from top -->
  <path d="M210 120 L302 120 L302 170 L210 170 Z" fill="#f8fafc" />
  <line x1="225" y1="135" x2="287" y2="135" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="225" y1="150" x2="270" y2="150" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

  <!-- Main POS Terminal Body -->
  <rect x="96" y="150" width="320" height="190" rx="24" fill="#ffffff" filter="url(#shadow)" />

  <!-- Terminal Display Glass -->
  <rect x="114" y="168" width="284" height="154" rx="14" fill="#0f172a" />

  <!-- Screen Header Accent Bar -->
  <rect x="128" y="180" width="256" height="8" rx="4" fill="#38bdf8" />

  <!-- Cart / Checkout Icon on Screen -->
  <circle cx="160" cy="225" r="14" fill="#3b82f6" />
  <path d="M153 225 L157 230 L167 220" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Price Pill (Green) -->
  <rect x="220" y="208" width="164" height="34" rx="8" fill="#10b981" />
  <text x="302" y="231" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">₱ 1,250.00</text>

  <!-- Items Lines -->
  <rect x="140" y="260" width="236" height="8" rx="4" fill="#64748b" />
  <rect x="140" y="278" width="160" height="8" rx="4" fill="#475569" />

  <!-- Barcode scanner lines on base -->
  <g transform="translate(196, 345)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#2563eb" stroke-width="6" />
    <line x1="12" y1="0" x2="12" y2="24" stroke="#2563eb" stroke-width="4" />
    <line x1="22" y1="0" x2="22" y2="24" stroke="#2563eb" stroke-width="8" />
    <line x1="36" y1="0" x2="36" y2="24" stroke="#2563eb" stroke-width="4" />
    <line x1="48" y1="0" x2="48" y2="24" stroke="#2563eb" stroke-width="6" />
    <line x1="62" y1="0" x2="62" y2="24" stroke="#2563eb" stroke-width="8" />
    <line x1="76" y1="0" x2="76" y2="24" stroke="#2563eb" stroke-width="4" />
    <line x1="88" y1="0" x2="88" y2="24" stroke="#2563eb" stroke-width="6" />
    <line x1="102" y1="0" x2="102" y2="24" stroke="#2563eb" stroke-width="10" />
    <line x1="120" y1="0" x2="120" y2="24" stroke="#2563eb" stroke-width="4" />
  </g>
</svg>
